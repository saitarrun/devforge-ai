<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0a0f1d" />
    </linearGradient>

    <!-- Subtle Radial Glow -->
    <radialGradient id="glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.12" />
      <stop offset="40%" stop-color="#6366f1" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Logo Gradient -->
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Text Accent Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#1e293b" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#334155" stop-opacity="0.8" />
    </linearGradient>

    <!-- Filter for soft glow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, Helvetica, Arial, sans-serif;
      font-size: 52px;
      font-weight: 800;
      letter-spacing: 4px;
      fill: #ffffff;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      fill: #38bdf8;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, Helvetica, Arial, sans-serif;
      font-size: 18px;
      font-weight: 400;
      letter-spacing: 0.5px;
      fill: #94a3b8;
    }
    .tag-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.8px;
      fill: #cbd5e1;
    }
  </style>

  <!-- Background Card -->
  <rect width="1200" height="340" rx="16" fill="url(#bgGradient)" />
  <rect width="1200" height="340" rx="16" fill="url(#glow)" />
  <rect x="0.5" y="0.5" width="1199" height="339" rx="16" fill="none" stroke="url(#borderGrad)" stroke-width="1" />

  <!-- Geometric Grid Accent (Minimalistic) -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="340" />
    <line x1="250" y1="0" x2="250" y2="340" />
    <line x1="950" y1="0" x2="950" y2="340" />
    <line x1="1100" y1="0" x2="1100" y2="340" />
    <line x1="0" y1="85" x2="1200" y2="85" />
    <line x1="0" y1="255" x2="1200" y2="255" />
  </g>

  <!-- Content Container (Centered) -->
  <g transform="translate(600, 0)">
    <!-- Top Pill / Status Indicator -->
    <g transform="translate(0, 56)">
      <rect x="-135" y="-14" width="270" height="28" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <circle cx="-110" cy="0" r="4" fill="#38bdf8" />
      <text class="badge-text" text-anchor="middle" x="10" y="4.5">AGENTIC SDLC WORKFLOW</text>
    </g>

    <!-- Main Forge / Hex Core Icon & Title Group -->
    <g transform="translate(0, 140)">
      <!-- Minimalist Icon -->
      <g transform="translate(-250, -4)" filter="url(#softGlow)">
        <!-- Outer Hexagon -->
        <polygon points="0,-26 22.5,-13 22.5,13 0,26 -22.5,13 -22.5,-13" fill="none" stroke="url(#logoGradient)" stroke-width="2.5" />
        <!-- Inner Core Diamond -->
        <polygon points="0,-12 10.5,0 0,12 -10.5,0" fill="url(#logoGradient)" opacity="0.9" />
        <!-- Micro Nodes -->
        <circle cx="0" cy="-26" r="2" fill="#38bdf8" />
        <circle cx="22.5" cy="13" r="2" fill="#818cf8" />
        <circle cx="-22.5" cy="13" r="2" fill="#c084fc" />
      </g>

      <!-- Main Title -->
      <text class="title" text-anchor="middle" x="20" y="16">
        DEVFORGE <tspan fill="url(#textGrad)">- AI</tspan>
      </text>
    </g>

    <!-- Subtitle -->
    <g transform="translate(0, 205)">
      <text class="subtitle" text-anchor="middle" x="0" y="0">
        Autonomous Multi-Agent Delivery System for Claude Code
      </text>
    </g>

    <!-- Minimalist Feature Chips -->
    <g transform="translate(0, 268)">
      <!-- Chip 1 -->
      <g transform="translate(-270, 0)">
        <rect x="-85" y="-15" width="170" height="30" rx="8" fill="#131c31" stroke="#22324f" stroke-width="1" />
        <text class="tag-text" text-anchor="middle" x="0" y="4.5">⚡ 10 Specialized Agents</text>
      </g>
      <!-- Chip 2 -->
      <g transform="translate(-90, 0)">
        <rect x="-75" y="-15" width="150" height="30" rx="8" fill="#131c31" stroke="#22324f" stroke-width="1" />
        <text class="tag-text" text-anchor="middle" x="0" y="4.5">🎯 5 SDLC Phases</text>
      </g>
      <!-- Chip 3 -->
      <g transform="translate(90, 0)">
        <rect x="-85" y="-15" width="170" height="30" rx="8" fill="#131c31" stroke="#22324f" stroke-width="1" />
        <text class="tag-text" text-anchor="middle" x="0" y="4.5">🛡️ Quality Gate Audits</text>
      </g>
      <!-- Chip 4 -->
      <g transform="translate(270, 0)">
        <rect x="-75" y="-15" width="150" height="30" rx="8" fill="#131c31" stroke="#22324f" stroke-width="1" />
        <text class="tag-text" text-anchor="middle" x="0" y="4.5">🚀 Tracer Delivery</text>
      </g>
    </g>
  </g>
</svg>
